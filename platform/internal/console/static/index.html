<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>智能门锁模拟平台</title>
<style>
:root {
  --bg: #f4f5f7; --panel: #fff; --ink: #1d2330; --muted: #6b7280; --line: #e3e6eb;
  --locked: #4b5b78; --unlocked: #1f9d55; --lockdown: #c2410c; --emergency: #d97706; --fault: #7c3aed;
  --offline: #c9ced6; --accent: #2563eb; --warn: #b45309; --bad: #dc2626;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #12151b; --panel: #1b2029; --ink: #e6e9ef; --muted: #9aa3b2; --line: #2b3240;
    --locked: #6b7fa3; --offline: #3a414e; --accent: #60a5fa; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; }
header h1 { font-size: 17px; margin: 0 12px 0 0; }
.chip { display: inline-flex; gap: 6px; align-items: center; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); font-size: 12px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--offline); }
.dot.on { background: var(--unlocked); }
main { display: grid; grid-template-columns: minmax(0, 1fr) 430px; gap: 14px; padding: 14px 16px; align-items: start; }
@media (max-width: 1100px) { main { grid-template-columns: 1fr; } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.card h2 { font-size: 14px; margin: 0 0 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.muted { color: var(--muted); font-size: 12px; }
.grid { display: grid; gap: 3px; overflow-x: auto; }
.row { display: flex; gap: 3px; align-items: center; }
.flabel { width: 34px; font-size: 11px; color: var(--muted); text-align: right; padding-right: 4px; flex: none; }
.cell { width: 22px; height: 22px; border-radius: 4px; flex: none; cursor: pointer; position: relative; background: var(--locked); border: 2px solid transparent; transition: background .25s; }
.cell.UNLOCKED { background: var(--unlocked); } .cell.LOCKDOWN { background: var(--lockdown); }
.cell.EMERGENCY { background: var(--emergency); } .cell.FAULT { background: var(--fault); }
.cell.rfoff { background: repeating-linear-gradient(45deg, var(--offline), var(--offline) 3px, transparent 3px, transparent 6px) !important; }
.cell.unjoined { opacity: .35; }
.cell.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.cell .b { position: absolute; right: -2px; top: -2px; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); border: 1px solid var(--panel); }
.cell .b.crit { background: var(--bad); }
.cell .c { position: absolute; left: 2px; bottom: 1px; width: 5px; height: 5px; border-radius: 50%; background: #fff; opacity: .8; }
.cell .d { position: absolute; left: 2px; top: 2px; width: 6px; height: 6px; border-radius: 1px; background: #111827; border: 1px solid #fff; }
.cell.dooropen { outline: 2px dashed var(--warn); outline-offset: -2px; }
.cell .r { position: absolute; right: 1px; bottom: 1px; width: 6px; height: 6px; border-radius: 50%; background: #38bdf8; animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .2; } }
input.short { width: 90px !important; }
.gwsep { height: 6px; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; }
button { font: inherit; font-size: 13px; padding: 5px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
button.danger { color: var(--bad); }
.btns { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.grp { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line); }
.grp > .t { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
input[type=text] { font: inherit; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); width: 120px; }
input[type=range] { width: 160px; vertical-align: middle; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th, td { text-align: left; padding: 3px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-weight: normal; }
.st-executed { color: var(--unlocked); } .st-failed, .st-expired { color: var(--bad); } .st-delivered { color: var(--accent); }
.log { height: 320px; overflow-y: auto; font-size: 12px; font-family: ui-monospace, Menlo, Consolas, monospace; }
.log div { padding: 1px 0; border-bottom: 1px dotted var(--line); }
.k-access { color: var(--unlocked); } .k-alarm { color: var(--bad); } .k-security { color: var(--fault); font-weight: 600; }
.k-cmd { color: var(--accent); } .k-fw { color: var(--muted); } .k-battery { color: var(--warn); }
.k-door { color: #0e7490; } .k-request { color: #0284c7; font-weight: 600; }
.bottom { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 0 16px 16px; }
@media (max-width: 1100px) { .bottom { grid-template-columns: 1fr; } }
.progress { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; margin: 6px 0; }
.progress > div { height: 100%; background: var(--unlocked); width: 0; transition: width .3s; }
.kv { display: grid; grid-template-columns: 90px 1fr; gap: 2px 8px; font-size: 12px; }
.kv b { font-weight: normal; color: var(--muted); }
svg text { font-family: inherit; }
.filters button { font-size: 11px; padding: 2px 8px; }
.filters button.on { background: var(--accent); color: #fff; }
</style>
</head>
<body>
<header>
  <h1>智能门锁模拟平台</h1>
  <span id="gws"></span>
  <span class="chip" id="simst"><span class="dot"></span>模拟器</span>
  <span class="chip">空口丢包 <input type="range" id="loss" min="0" max="50" value="0"> <span id="lossv">0%</span></span>
  <span class="muted" id="clock"></span>
</header>

<main>
  <section class="card">
    <h2><span>楼栋视图 <span class="muted" id="bldinfo"></span></span><span class="muted">点击房间查看主板与操作</span></h2>
    <div class="legend">
      <span><i style="background:var(--locked)"></i>已上锁</span>
      <span><i style="background:var(--unlocked)"></i>已开门</span>
      <span><i style="background:var(--emergency)"></i>应急常开</span>
      <span><i style="background:var(--lockdown)"></i>封锁</span>
      <span><i style="background:var(--fault)"></i>故障</span>
      <span><i style="background:repeating-linear-gradient(45deg,var(--offline),var(--offline) 3px,transparent 3px,transparent 6px)"></i>射频离线</span>
      <span><i style="background:var(--warn);border-radius:50%"></i>低电量</span>
      <span><i style="background:#fff;border:1px solid var(--line);border-radius:50%"></i>已有凭证</span>
      <span><i style="background:#111827;border:1px solid #fff"></i>室内反锁</span>
      <span><i style="outline:2px dashed var(--warn);outline-offset:-2px;background:var(--locked)"></i>门开着</span>
      <span><i style="background:#38bdf8;border-radius:50%"></i>访客请求开门</span>
    </div>
    <div class="grid" id="grid"></div>

    <div class="grp">
      <div class="t">整栋楼批量操作（观察整栋楼在几秒内全部变色）</div>
      <div class="btns">
        <button onclick="bld('issue-cards')">批量发卡（每间一张）</button>
        <button onclick="bld('revoke-cards')">批量删卡</button>
        <button onclick="bld('unlock-all')">逐间远程开门（单播）</button>
        <button onclick="bld('status-all')">全楼状态巡检</button>
        <button class="primary" onclick="bld('emergency-open')">应急常开（广播）</button>
        <button class="danger" onclick="bld('lockdown')">全楼封锁（广播）</button>
        <button onclick="bld('release')">恢复正常（广播）</button>
        <button onclick="bld('config',{autolock_s:+val('autolock')||5})">全楼统一自动落锁时间</button>
        <button class="danger" onclick="bld('clear-creds')">全楼清空凭证（毕业季）</button>
      </div>
      <div id="job" class="muted">尚未执行批量操作</div>
      <div class="progress"><div id="jobbar"></div></div>
    </div>
  </section>

  <section class="card" id="side">
    <h2><span id="seltitle">未选择门锁</span><span class="muted" id="selsub"></span></h2>
    <svg id="board" viewBox="0 0 400 230" width="100%"></svg>
    <div class="kv" id="selkv"></div>

    <div class="grp"><div class="t">门口操作（模拟真实世界）</div>
      <div class="btns">
        <input type="text" id="uid" placeholder="卡号 UID">
        <button class="primary" onclick="sim('swipe',{uid:val('uid')})">刷卡</button>
        <button onclick="sim('swipe',{uid:'DEADBEEF'})">刷一张陌生卡</button>
      </div>
      <div class="btns">
        <input type="text" id="digits" class="short" placeholder="键盘输入">
        <button class="primary" onclick="sim('keypad',{digits:val('digits')})">输入密码 #</button>
        <button onclick="bleOpen(false)">学生手机蓝牙开门</button>
        <button onclick="bleOpen(true)">宿管手机蓝牙开门</button>
      </div>
      <div class="btns">
        <button onclick="sim('door',{open:true})">推开门</button>
        <button onclick="sim('door',{open:false})">关上门</button>
        <button onclick="sim('dlock',{on:true})">室内反锁</button>
        <button onclick="sim('dlock',{on:false})">解除反锁</button>
        <button onclick="sim('doorbell')">访客按呼叫键</button>
        <button class="danger" onclick="sim('key')">机械钥匙开门</button>
        <button class="danger" onclick="sim('pry')">撬面板</button>
      </div>
    </div>
    <div class="grp"><div class="t">平台下发（经 MQTT → 网关 → 433MHz）</div>
      <div class="btns">
        <button class="primary" onclick="cmd('unlock',{duration_s:5})">远程开门</button>
        <button onclick="cmd('status')">状态查询</button>
        <button onclick="cmd('cards',{uid:val('uid'),user_id:2024001})">添加此卡</button>
        <button onclick="delCard()">删除此卡</button>
        <button onclick="cmd('lockdown')">封锁本门</button>
        <button onclick="cmd('release')">解除</button>
        <button onclick="cmd('requests/approve')">批准访客开门请求</button>
      </div>
    </div>
    <div class="grp"><div class="t">密码与成员（平台下发）</div>
      <div class="btns">
        <input type="text" id="pin" class="short" placeholder="6~10 位密码" value="246810">
        <button onclick="cmd('passwords',{pin:val('pin'),user_id:+val('user')})">添加密码</button>
        <button onclick="cmd('passwords',{pin:val('pin'),user_id:9001,uses:1,valid_hours:24})">一次性访客密码</button>
        <button onclick="cmd('passwords',{pin:val('pin'),user_id:+val('user'),duress:true})">胁迫密码</button>
      </div>
      <div class="btns">
        离线密码
        <button onclick="ofp('once')">一次性</button>
        <button onclick="ofp('timed',8)">限时 8 小时</button>
        <button onclick="ofp('clear')">清除码</button>
        <span id="ofp" class="muted"></span>
      </div>
      <div class="btns">
        成员 <input type="text" id="user" class="short" value="2024001">
        <button onclick="cmd('users/'+val('user')+'/freeze',{freeze:true})">冻结</button>
        <button onclick="cmd('users/'+val('user')+'/freeze',{freeze:false})">解冻</button>
        <button class="danger" onclick="post(`/api/locks/${sel}/users/${val('user')}`, null, 'DELETE')">退宿（删除成员全部凭证）</button>
      </div>
      <div class="btns">
        参数 自动落锁 <input type="text" id="autolock" class="short" value="5" style="width:50px!important"> 秒
        <button onclick="cmd('config',{autolock_s:+val('autolock')})">下发</button>
        <button onclick="cmd('config',{remote_allowed:false})">禁止直接远程开门</button>
        <button onclick="cmd('config',{remote_allowed:true})">允许远程开门</button>
      </div>
    </div>
    <div class="grp"><div class="t">故障与环境</div>
      <div class="btns">
        电池 <input type="range" id="batt" min="3600" max="6000" step="50" value="5800" oninput="$('battv').textContent=this.value+' mV'"> <span id="battv">5800 mV</span>
        <button onclick="sim('battery',{mv:+val('batt')})">设置电压</button>
      </div>
      <div class="btns">
        <button onclick="sim('rf',{on:false})">射频遮挡（离线）</button>
        <button onclick="sim('rf',{on:true})">恢复在线</button>
        <button onclick="sim('dropack',{n:1})">丢掉下一个 ACK</button>
        <button onclick="sim('jam',{n:2})">电机卡死</button>
        <button onclick="sim('clock',{delta_s:-300})">时钟慢 5 分钟</button>
      </div>
    </div>
    <div class="grp"><div class="t">攻击者（截获空中最后一帧）</div>
      <div class="btns">
        <button class="danger" onclick="sim('replay')">原样重放</button>
        <button class="danger" onclick="sim('tamper')">篡改后重发</button>
      </div>
    </div>
    <div class="muted" id="reply"></div>
  </section>
</main>

<div class="bottom">
  <section class="card">
    <h2>指令追踪 <span class="muted">排队 → 网关接收 → 空口 ACK → 门锁执行结果</span></h2>
    <div style="max-height:360px;overflow:auto"><table><thead><tr><th>指令号</th><th>门</th><th>指令</th><th>状态</th><th>结果</th><th>发送次数</th><th>耗时</th><th>说明</th></tr></thead><tbody id="cmds"></tbody></table></div>
  </section>
  <section class="card">
    <h2>事件日志
      <span class="filters" id="filters"></span>
    </h2>
    <div class="log" id="log"></div>
  </section>
</div>

<script>
const $ = id => document.getElementById(id);
const val = id => $(id).value.trim();
let S = null, sel = null, lastEv = 0, events = [], filter = 'all', curJob = null;
const KINDS = {all:'全部', access:'开门', alarm:'告警', door:'门磁/反锁', request:'访客请求', security:'安全', cmd:'指令', fw:'固件日志', system:'系统'};
const STATES = ['LOCKED','UNLOCKED','LOCKDOWN','EMERGENCY','FAULT'];
const STATE_CN = {LOCKED:'已上锁',UNLOCKED:'已开门',LOCKDOWN:'封锁',EMERGENCY:'应急常开',FAULT:'故障'};

$('filters').innerHTML = Object.entries(KINDS).map(([k,v]) => `<button data-k="${k}" class="${k==='all'?'on':''}">${v}</button>`).join(' ');
$('filters').onclick = e => { if (!e.target.dataset.k) return; filter = e.target.dataset.k;
  [...$('filters').children].forEach(b => b.classList.toggle('on', b.dataset.k === filter)); renderLog(true); };

let lossTimer;
$('loss').oninput = e => { $('lossv').textContent = e.target.value + '%'; clearTimeout(lossTimer);
  lossTimer = setTimeout(() => post('/api/sim/loss', {pct: +e.target.value}), 200); };

async function post(url, body, method='POST') {
  const r = await fetch(url, {method, body: body ? JSON.stringify(body) : undefined});
  const t = await r.text();
  $('reply').textContent = (r.ok ? '' : '错误: ') + t.slice(0, 200);
  try { return JSON.parse(t); } catch { return null; }
}
function roomOf(l) { return l.room; }
function cardUID(floor, room) { const h = n => n.toString(16).padStart(2,'0').toUpperCase();
  return h(0xC0 | (S.layout.Building & 15)) + h(S.layout.Building >> 4) + h(floor) + h(room); }
function cmd(path, body) { if (!sel) return; return post(`/api/locks/${sel}/${path}`, body); }
function sim(path, body) { if (!sel) return; return post(`/api/sim/locks/${sel}/${path}`, body); }
function delCard() { if (sel) post(`/api/locks/${sel}/cards/${val('uid')}`, null, 'DELETE'); }
async function bld(action, body) { const r = await post(`/api/buildings/${S.layout.Building}/${action}`, body); if (r && r.job) curJob = r.job; }
async function ofp(kind, hours) { if (!sel) return; const r = await post(`/api/locks/${sel}/offline-password`, {kind, hours});
  if (r && r.password) { $('ofp').textContent = `${r.password}（${r.desc}）`; $('digits').value = r.password; } }
async function bleOpen(admin) { if (!sel) return;
  const k = await post(`/api/locks/${sel}/ble-key`, {user_id: admin ? 1 : +val('user'), hours: 2, admin});
  if (k && k.token) sim('ble', {token: k.token}); }

function select(room) {
  sel = room;
  const l = S.locks.find(x => x.room === room);
  $('uid').value = cardUID(l.floor, l.room_no);
  if (l.sim) { $('batt').value = l.sim.battery_mv; $('battv').textContent = l.sim.battery_mv + ' mV'; }
  render();
}

function renderGrid() {
  const L = S.layout, by = {};
  S.locks.forEach(l => by[l.room] = l);
  let html = '';
  for (let f = L.Floors; f >= 1; f--) {
    html += `<div class="row"><div class="flabel">${f}F</div>`;
    for (let r = 1; r <= L.Rooms; r++) {
      const name = f + String(r).padStart(2, '0'), l = by[name], s = l && l.sim;
      const st = s ? STATES[s.state] : (l.state || 'LOCKED');
      const fl = s ? s.flags : 0;
      const cls = ['cell', st, s && !s.rf ? 'rfoff' : '', s && !s.joined ? 'unjoined' : '', sel === name ? 'sel' : '', fl & 1 ? 'dooropen' : ''].join(' ');
      const bl = s ? s.batt_level : l.batt_level;
      html += `<div class="${cls}" title="${name} ${STATE_CN[st]}${s ? ' · ' + s.battery_mv + 'mV · 卡 ' + s.cards : ''}" onclick="select('${name}')">` +
        (bl ? `<span class="b ${bl > 1 ? 'crit' : ''}"></span>` : '') + (s && s.cards ? '<span class="c"></span>' : '') + (fl & 2 ? '<span class="d"></span>' : '') +
        (l.request && new Date(l.request.until) > Date.now() ? '<span class="r"></span>' : '') + '</div>';
    }
    html += '</div>';
    if ((f - 1) % L.FloorsPerGW === 0 && f > 1) html += '<div class="gwsep"></div>';
  }
  $('grid').innerHTML = html;
}

function board(l) {
  const s = l && l.sim;
  const now = s ? s.ind_age_ms : 999999;
  const ind = s ? s.ind : -1;
  const lit = now < 1500;
  const led = !lit ? '#555' : ['#22c55e', '#ef4444', '#f59e0b', '#ef4444'][ind] || '#555';
  const buzz = now < 800;
  const mv = s ? s.battery_mv : 0, pct = Math.max(0, Math.min(1, (mv - 3600) / 2400));
  const st = s ? STATES[s.state] : '—';
  const rf = s && s.rf;
  const fg = 'currentColor';
  return `
  <rect x="2" y="2" width="396" height="226" rx="10" fill="#0f5132" opacity=".18" stroke="#0f5132"/>
  <text x="12" y="20" font-size="11" fill="${fg}" opacity=".7">门锁主板（虚拟）· 24×240 锁体面板</text>
  <g>
    <rect x="132" y="70" width="136" height="70" rx="6" fill="#1f2937" stroke="#94a3b8"/>
    <text x="200" y="98" text-anchor="middle" font-size="12" fill="#e5e7eb">EFR32FG28</text>
    <text x="200" y="114" text-anchor="middle" font-size="10" fill="#9ca3af">Sub-GHz 433MHz + BLE</text>
    <text x="200" y="128" text-anchor="middle" font-size="10" fill="#9ca3af">${st}</text>
  </g>
  <g>
    <line x1="200" y1="70" x2="200" y2="40" stroke="#94a3b8" stroke-width="2"/>
    <path d="M190 40 L200 28 L210 40" fill="none" stroke="${rf ? '#22c55e' : '#ef4444'}" stroke-width="2"/>
    <text x="215" y="38" font-size="10" fill="${fg}">433MHz ${s ? (rf ? `信道${s.channel} 时隙${s.slot}` : '被遮挡') : ''}</text>
  </g>
  <g>
    <rect x="20" y="70" width="95" height="44" rx="5" fill="none" stroke="#94a3b8"/>
    <text x="67" y="89" text-anchor="middle" font-size="11" fill="${fg}">NFC 读卡</text>
    <text x="67" y="104" text-anchor="middle" font-size="9" fill="${fg}" opacity=".7">校园卡只读 UID</text>
    <line x1="115" y1="92" x2="132" y2="92" stroke="#94a3b8"/>
  </g>
  <g>
    <rect x="20" y="130" width="95" height="44" rx="5" fill="none" stroke="#94a3b8" stroke-dasharray="4 3"/>
    <text x="67" y="149" text-anchor="middle" font-size="11" fill="${fg}">密码键盘 · 蓝牙</text>
    <text x="67" y="164" text-anchor="middle" font-size="9" fill="${fg}" opacity=".6">指纹/人脸接口预留</text>
  </g>
  <g>
    <rect x="285" y="70" width="100" height="44" rx="5" fill="none" stroke="#94a3b8"/>
    <text x="335" y="88" text-anchor="middle" font-size="11" fill="${fg}">电机驱动 → 离合</text>
    <text x="335" y="104" text-anchor="middle" font-size="10" fill="${s && s.clutch ? '#22c55e' : fg}">${s ? (s.clutch ? '啮合（把手可开门）' : '分离（空转）') : ''}</text>
    <line x1="268" y1="92" x2="285" y2="92" stroke="#94a3b8"/>
  </g>
  <g>
    <circle cx="300" cy="150" r="10" fill="${led}" stroke="#94a3b8"/>
    <text x="300" y="178" text-anchor="middle" font-size="10" fill="${fg}">指示灯</text>
    <rect x="340" y="140" width="22" height="20" rx="4" fill="none" stroke="#94a3b8"/>
    ${buzz ? '<path d="M366 144 q6 6 0 12 M371 140 q10 10 0 20" fill="none" stroke="#f59e0b" stroke-width="1.5"/>' : ''}
    <text x="351" y="178" text-anchor="middle" font-size="10" fill="${fg}">蜂鸣器</text>
  </g>
  <g>
    <rect x="140" y="160" width="120" height="44" rx="5" fill="none" stroke="#94a3b8"/>
    <rect x="148" y="186" width="${Math.round(104 * pct)}" height="10" rx="2" fill="${s && s.batt_level ? (s.batt_level > 1 ? '#ef4444' : '#f59e0b') : '#22c55e'}"/>
    <rect x="148" y="186" width="104" height="10" rx="2" fill="none" stroke="#94a3b8"/>
    <text x="200" y="179" text-anchor="middle" font-size="11" fill="${fg}">4×AA 电池 ${s ? mv + ' mV' : ''}</text>
    <line x1="200" y1="140" x2="200" y2="160" stroke="#94a3b8"/>
  </g>`;
}

function fmtAgo(t) { if (!t || t.startsWith('0001')) return '—'; const s = (Date.now() - new Date(t)) / 1000; return s < 60 ? Math.round(s) + ' 秒前' : Math.round(s / 60) + ' 分钟前'; }

function renderSide() {
  const l = sel && S.locks.find(x => x.room === sel);
  $('board').innerHTML = board(l);
  if (!l) return;
  $('seltitle').textContent = `房间 ${l.room}`;
  $('selsub').textContent = `${l.eui} · ${l.gateway}`;
  const s = l.sim || {};
  $('selkv').innerHTML = [
    ['真实状态', l.sim ? STATE_CN[STATES[s.state]] + (s.rf ? '' : '（射频离线）') : '—'],
    ['平台看到', (l.online ? '在线' : '离线') + ' · 最近上报 ' + fmtAgo(l.last_seen)],
    ['网络参数', l.sim ? `短地址 0x${s.short.toString(16).padStart(4,'0')} · 信道 ${s.channel} · 时隙 ${s.slot} · RSSI ${l.rssi || '—'} dBm` : '—'],
    ['电池', l.battery_mv ? `${l.battery_mv} mV（平台）` + (['', ' · 低电量', ' · 严重低电'][l.batt_level] || '') : '—'],
    ['已存凭证', `${s.cards ?? '—'} 张（锁内） / ${l.cards} 张（最近上报）`],
    ['最近开门', l.last_access || '—'],
    ['门 / 反锁', `${s.flags & 1 ? '开着' : '关着'} / ${s.flags & 2 ? '已反锁' : '未反锁'}${s.flags & 4 ? ' · 试错冻结中' : ''}`],
    ['开门记录', `锁内序号 ${s.log_seq ?? '—'} · 平台收到 ${l.records} 条${l.missing ? ` · 缺 ${l.missing} 条待补传` : ''}${l.read_logs ? ` · 已补传 ${l.read_logs} 次` : ''}`],
    ['连接', `待上行 ${s.up_pending ?? 0} 条 · 重连 ${l.reconnects} 次 · 时钟偏差 ${s.clock_offset_s ?? 0} 秒`],
    ['参数', `自动落锁 ${s.autolock_s ?? '—'} 秒 · ${s.remote_allowed ? '允许远程开门' : '远程开门需访客请求'}`],
    ['告警', l.alarms ? `${l.alarms} 次 · 最近：${l.last_alarm}` : '—'],
    ['访客请求', l.request && new Date(l.request.until) > Date.now() ? `请求 ${l.request.id}，等待批准` : '—'],
  ].map(([k, v]) => `<b>${k}</b><span>${v}</span>`).join('');
}

function fmtMs(a, b) { if (!a || !b || b.startsWith('0001')) return ''; return Math.round(new Date(b) - new Date(a)) + ' ms'; }
const STCN = {queued:'排队', accepted:'网关已收', delivered:'已送达', executed:'已执行', failed:'失败', expired:'过期'};
function renderCmds() {
  const room = eui => { const l = S.locks.find(x => x.eui === eui); return l ? l.room : ''; };
  $('cmds').innerHTML = S.commands.map(c => `<tr>
    <td>${c.msg_id}</td><td>${c.group ? '整栋/' + c.gateway : room(c.lock)}</td><td>${c.cmd_name}</td>
    <td class="st-${c.status}">${STCN[c.status] || c.status}</td>
    <td>${c.group ? (c.executed || 0) + '/' + (c.expected || '?') + ' 把' : (c.result || '')}</td>
    <td>${c.attempts || ''}${c.resends ? ' (+补发' + c.resends + ')' : ''}</td>
    <td>${fmtMs(c.queued_at, c.executed_at)}</td><td class="muted">${c.reason || ''}</td></tr>`).join('');
}

function renderLog(full) {
  const box = $('log'), stick = box.scrollTop + box.clientHeight > box.scrollHeight - 30;
  const rows = events.filter(e => filter === 'all' || e.kind === filter).slice(-500);
  box.innerHTML = rows.map(e => `<div class="k-${e.kind}">${new Date(e.at).toLocaleTimeString()} ${e.room ? '[' + e.room + '] ' : ''}${e.text}</div>`).join('');
  if (stick || full) box.scrollTop = box.scrollHeight;
}

async function renderJob() {
  if (!curJob) return;
  const r = await fetch('/api/jobs/' + curJob); if (!r.ok) return;
  const j = await r.json();
  const pct = j.locks_total ? Math.round(100 * j.locks_done / j.locks_total) : 0;
  $('jobbar').style.width = pct + '%';
  const res = Object.entries(j.results).map(([k, v]) => `${k} ${v}`).join('，');
  $('job').innerHTML = `<b>${j.name}</b>：${j.locks_done}/${j.locks_total} 把锁已执行（${pct}%），` +
    `${j.done ? '全部完成，总耗时' : '已用时'} <b>${(j.elapsed_ms / 1000).toFixed(2)} 秒</b>` +
    (j.p50_ms ? `，单锁耗时 P50 ${j.p50_ms} ms / 最大 ${j.max_ms} ms` : '') + (res ? `；结果：${res}` : '');
}

function render() {
  if (!S) return;
  renderGrid(); renderSide(); renderCmds();
  $('bldinfo').textContent = `${S.layout.Building} 号楼 · ${S.layout.Floors} 层 × ${S.layout.Rooms} 间 = ${S.locks.length} 把锁 · 每 ${S.layout.FloorsPerGW} 层一台网关`;
  $('gws').innerHTML = (S.gateways || []).map(g => `<span class="chip"><span class="dot ${g.online ? 'on' : ''}"></span>${g.id} · ${g.locks} 把锁 · 队列 ${g.pending} · ${g.channels}信道×${g.slots}时隙</span>`).join(' ');
  $('simst').innerHTML = `<span class="dot ${S.sim_ok ? 'on' : ''}"></span>模拟器 ${S.sim_ok ? '运行中' : '未连接'}`;
  if (document.activeElement !== $('loss')) { $('loss').value = S.loss; $('lossv').textContent = S.loss + '%'; }
  $('clock').textContent = new Date(S.now).toLocaleTimeString();
}

async function poll() {
  try {
    const r = await fetch('/api/state?since=' + lastEv);
    S = await r.json();
    if (S.events && S.events.length) { events.push(...S.events); lastEv = S.events[S.events.length - 1].id; if (events.length > 2000) events = events.slice(-1500); renderLog(); }
    if (!sel && S.locks.length) select(S.locks[0].room);
    render(); renderJob();
  } catch (e) { $('simst').innerHTML = '<span class="dot"></span>平台未连接'; }
  setTimeout(poll, 500);
}
poll();
</script>
</body>
</html>
