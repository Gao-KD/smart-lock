# Single-server on-premise deployment for one school (a few thousand locks).
# Larger campuses: Kubernetes edition (TODO), same images.
#
#   cd platform/deploy && docker compose up -d
#
# Change every password below before use; keep this host on the campus network.
services:
  emqx:
    image: emqx/emqx:5.8.0
    restart: unless-stopped
    ports:
      - "8883:8883"   # MQTT over TLS, gateways connect here
      - "18083:18083" # dashboard, restrict to the admin network
    volumes:
      - emqx-data:/opt/emqx/data

  postgres:
    image: postgres:16.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartlock
      POSTGRES_USER: smartlock
      POSTGRES_PASSWORD: change-me
    volumes:
      - pg-data:/var/lib/postgresql/data

  redis:
    image: redis:7.4.1
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  # For the PC simulator (virtual locks + gateways) use deploy/sim instead.
  platform:
    build:
      context: ../..
      dockerfile: platform/deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on: [emqx, postgres, redis]

volumes:
  emqx-data:
  pg-data:
  redis-data:
