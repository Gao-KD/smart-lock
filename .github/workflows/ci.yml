name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  c:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and test protocol library, lock firmware (host) and locksim
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build -j
          ctest --test-dir build --output-on-failure

  go:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        module: [common/slpgo, gateway, platform]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Vet and test
        working-directory: ${{ matrix.module }}
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...

  # Whole system on one runner: 360 virtual locks, 2 gateways, platform,
  # then every feature demo end to end.
  sim-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Start simulator
        run: |
          scripts/sim.sh > sim.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8080/api/state?locks=0 >/dev/null && break; sleep 1; done
      - name: Run all feature demos
        run: scripts/demo.sh all
      - name: Logs
        if: always()
        run: tail -n 50 sim.log .sim/logs/*.log
